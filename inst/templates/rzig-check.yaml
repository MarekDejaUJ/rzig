# Generated by rzig::use_rzig_ci(). R CMD check --as-cran on each operating
# system and Zig version of the matrix; the Zig tests of src/rzig/src/tests.zig
# run first when that file exists.
name: R-CMD-check-rzig

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.os }}, Zig ${{ matrix.zig }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [@OS@]
        zig: [@ZIG@]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run the Zig tests
        if: hashFiles('src/rzig/src/tests.zig') != ''
        working-directory: src/rzig
        run: zig build test --summary all
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
