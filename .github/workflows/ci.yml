name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with: { version: "0.16.0" }   # keep in sync with build.zig.zon
      - run: zig version
      - run: zig build gen-abi-check
      - run: git diff --exit-code -- tools/abi_check.c tests/fixtures/rzigtest/src/abi_check.c
      - run: zig build gen
      - run: git diff --exit-code -- src/generated/arity.zig src/generated/manifest.zig tests/fixtures/rzigtest/src/rzig/framework/generated/manifest.zig
      - run: sh tools/sync_fixture.sh --check
      - run: zig fmt --check build.zig src tools tests/fixtures/rzigtest/src/rzig
      - run: zig build test
      - run: zig build --release=safe
      - run: zig build lint

  r-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with: { version: "0.16.0" }
      - name: Select the Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          working-directory: tests/fixtures/rzigtest
      - name: Install CRAN shell checker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y devscripts valgrind
      - name: Install CRAN shell checker (macOS)
        if: runner.os == 'macOS'
        run: brew install checkbashisms
      - name: R CMD check
        run: |
          zig version
          chmod +x tests/fixtures/rzigtest/configure tests/fixtures/rzigtest/configure.win
          R CMD build tests/fixtures/rzigtest
          check_args=(--as-cran --no-manual)
          if [ "${{ runner.os }}" = Linux ]; then
            check_args+=(--use-valgrind)
            export RZIG_RUNNING_UNDER_VALGRIND=true
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            export RZIG_SKIP_PANIC_RECOVERY=true
          fi
          R CMD check "${check_args[@]}" rzigtest_*.tar.gz
          if grep -Eq 'Status:.*(ERROR|WARNING)' rzigtest.Rcheck/00check.log; then
            cat rzigtest.Rcheck/00check.log
            exit 1
          fi
        shell: bash
      - name: Check causal-discovery example
        run: |
          chmod +x examples/rzigcausal/configure examples/rzigcausal/configure.win
          R CMD build examples/rzigcausal
          causal_check_args=(--as-cran --no-manual)
          if [ "${{ runner.os }}" = Linux ]; then
            causal_check_args+=(--use-valgrind)
          fi
          R CMD check "${causal_check_args[@]}" rzigcausal_*.tar.gz
          if grep -Eq 'Status:.*(ERROR|WARNING)' rzigcausal.Rcheck/00check.log; then
            cat rzigcausal.Rcheck/00check.log
            exit 1
          fi
        shell: bash
      - name: Show check log on failure
        if: failure()
        run: |
          cat rzigtest.Rcheck/00install.out rzigtest.Rcheck/00check.log rzigtest.Rcheck/tests/testthat.Rout* || true
          cat rzigcausal.Rcheck/00install.out rzigcausal.Rcheck/00check.log rzigcausal.Rcheck/tests/testthat.Rout* || true
        shell: bash
      - name: Verify installation with a read-only home
        if: runner.os == 'Linux'
        run: ZIG="$(command -v zig)" sh tools/check_readonly_home.sh rzigtest_*.tar.gz
        shell: bash
      - name: Verify use_rzig scaffolding
        if: runner.os == 'Linux'
        run: ZIG="$(command -v zig)" sh tools/check_use_rzig.sh
        shell: bash
      - name: Verify README onboarding under ten minutes
        if: runner.os == 'Linux'
        run: ZIG="$(command -v zig)" sh tools/check_readme_onboarding.sh
        shell: bash
      - name: Run GC stress suite
        if: runner.os == 'macOS'
        run: |
          gc_library="$RUNNER_TEMP/rzig-gc-library"
          mkdir -p "$gc_library"
          R CMD INSTALL --library="$gc_library" rzigtest_*.tar.gz
          R_LIBS="$gc_library" Rscript tools/gctorture_run.R tests/abuse.R
        shell: bash
      - name: Run causal-example GC stress
        if: runner.os == 'macOS'
        run: |
          causal_gc_library="$RUNNER_TEMP/rzigcausal-gc-library"
          mkdir -p "$causal_gc_library"
          R CMD INSTALL --library="$causal_gc_library" rzigcausal_*.tar.gz
          R_LIBS="$causal_gc_library" Rscript examples/rzigcausal/tools/gctorture.R
        shell: bash
