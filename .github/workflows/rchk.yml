name: rchk

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: rchk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rchk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
      - name: Build fixture source package
        run: R CMD build tests/fixtures/rzigtest
      - name: Build rchk image with Zig
        run: docker build --file tools/rchk.Dockerfile --tag rzig-rchk .
      - name: Analyze the package C bridge
        run: |
          result_root="$RUNNER_TEMP/rchk"
          package_dir="$result_root/packages"
          mkdir -p "$package_dir"
          cp rzigtest_*.tar.gz "$package_dir/"
          package_tar=$(find "$package_dir" -maxdepth 1 -name 'rzigtest_*.tar.gz' -print -quit)
          package_name=$(basename "$package_tar")
          docker run --rm \
            --volume "$package_dir:/rchk/packages" \
            rzig-rchk \
            "/rchk/packages/$package_name"
          sh tools/check_rchk_output.sh \
            "$package_dir/libsonly/rzigtest/libs"
